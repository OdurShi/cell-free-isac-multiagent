name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  environment-smoke-test:
    # Exercises simulation/isac_env.py on the shipped .npy databases only.
    # Ray tracing (Sionna), SAC training and the desktop GUI are not run in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install "numpy<2" "gym==0.26.2" pytest
      - name: Test
        run: python -m pytest tests -q
