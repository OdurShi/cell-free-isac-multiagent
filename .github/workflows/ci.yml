name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  placement-study:
    # Lint and the offline tests of the cfisac_ma package (objective, algorithms,
    # propositions, shipped data and result files).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  simulator:
    # The whole test suite with the classic Gym package installed, so that the tests of
    # simulation/isac_env.py run as well (they are skipped without it).
    # Ray tracing (Sionna), SAC training and the desktop GUI are not run in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" "gym==0.26.2"
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -rs
